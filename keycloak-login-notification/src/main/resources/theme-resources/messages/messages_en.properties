# {0} = realm display name
loginNotificationSubject=New sign-in to your {0} account

# {0} = username, {1} = realm display name
loginNotificationIntro=Hello {0},\n\nthere was a new sign-in to your {1} account.
loginNotificationIntroHtml=<p>Hello {0},</p><p>there was a new sign-in to your <b>{1}</b> account.</p>

# {0} = days since the previous sign-in
loginNotificationReasonInactivity=The previous sign-in was {0} days ago.
loginNotificationReasonInactivityHtml=<p>The previous sign-in was {0} days ago.</p>
# {0} = hours since the previous sign-in (periods shorter than a day)
loginNotificationReasonInactivityHours=The previous sign-in was {0} hours ago.
loginNotificationReasonInactivityHoursHtml=<p>The previous sign-in was {0} hours ago.</p>
loginNotificationReasonNewIp=It came from an IP address that was not used for this account recently.
loginNotificationReasonNewIpHtml=<p>It came from an IP address that was not used for this account recently.</p>

# {0} = time, {1} = IP address, {2} = application, {3} = browser (User-Agent)
loginNotificationDetails=Time: {0}\nIP address: {1}\nApplication: {2}\nBrowser: {3}
loginNotificationDetailsHtml=<p>Time: {0}<br/>IP address: {1}<br/>Application: {2}<br/>Browser: {3}</p>

# {0} = account console URL
loginNotificationAction=If this was you, no action is needed. If it was not, change your password right away and review your active sessions:\n{0}
loginNotificationActionHtml=<p>If this was you, no action is needed. If it was not, <a href="{0}">change your password</a> right away and review your active sessions.</p>
