# {0} = назва realm-у
loginNotificationSubject=Новий вхід до облікового запису {0}

# {0} = ім’я користувача, {1} = назва realm-у
loginNotificationIntro=Вітаємо, {0}!\n\nЩойно виконано вхід до вашого облікового запису {1}.
loginNotificationIntroHtml=<p>Вітаємо, {0}!</p><p>Щойно виконано вхід до вашого облікового запису <b>{1}</b>.</p>

# {0} = днів від попереднього входу
loginNotificationReasonInactivity=Попередній вхід був {0} дн. тому.
loginNotificationReasonInactivityHtml=<p>Попередній вхід був {0} дн. тому.</p>
# {0} = годин від попереднього входу (періоди, коротші за добу)
loginNotificationReasonInactivityHours=Попередній вхід був {0} год. тому.
loginNotificationReasonInactivityHoursHtml=<p>Попередній вхід був {0} год. тому.</p>
loginNotificationReasonNewIp=Вхід виконано з IP-адреси, яка останнім часом для цього облікового запису не використовувалась.
loginNotificationReasonNewIpHtml=<p>Вхід виконано з IP-адреси, яка останнім часом для цього облікового запису не використовувалась.</p>

# {0} = час, {1} = IP-адреса, {2} = застосунок, {3} = браузер (User-Agent)
loginNotificationDetails=Час: {0}\nIP-адреса: {1}\nЗастосунок: {2}\nБраузер: {3}
loginNotificationDetailsHtml=<p>Час: {0}<br/>IP-адреса: {1}<br/>Застосунок: {2}<br/>Браузер: {3}</p>

# {0} = посилання на особистий кабінет
loginNotificationAction=Якщо це були ви, нічого робити не потрібно. Якщо ні, негайно змініть пароль і перегляньте активні сесії:\n{0}
loginNotificationActionHtml=<p>Якщо це були ви, нічого робити не потрібно. Якщо ні, негайно <a href="{0}">змініть пароль</a> і перегляньте активні сесії.</p>
