name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # GitHub-hosted runners have Docker, so the Testcontainers integration tests run here
      - run: ./mvnw -B verify
      - uses: actions/upload-artifact@v7
        with:
          name: keycloak-extensions
          path: '*/target/keycloak-*.jar'
