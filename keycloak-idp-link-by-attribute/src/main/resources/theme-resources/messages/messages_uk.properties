# Сторінки помилок кроку "Detect existing broker user by attribute"; {0} = email від identity provider.
# Змінити можна в Realm settings > Localization > Realm overrides або в login-темі.
# Апостроф лише типографський (’): звичайний ' у цих текстах обробляється як службовий символ.
idpAttrUserNotFound=Обліковий запис для {0} не знайдено. Зверніться до адміністратора.
idpAttrConflict=Конфлікт облікових записів: для {0} знайдено кілька облікових записів. Зверніться до адміністратора.
idpAttrAlreadyLinked=Обліковий запис уже прив’язаний до іншого акаунта цього identity provider. Зверніться до адміністратора.
idpAttrUserDisabled=Обліковий запис вимкнено. Зверніться до адміністратора.
idpAttrEmailNotVerified=Identity provider не підтвердив адресу {0}, тому її не можна прив’язати до облікового запису. Зверніться до адміністратора.
