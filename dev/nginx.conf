# Two hostnames in front of one Keycloak, as in a typical split setup.

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# auth.localhost: realms, login pages, account console and the impersonation links. No admin API.
server {
    listen 8080;
    server_name auth.localhost;

    location /admin/ {
        return 404;
    }

    location / {
        proxy_pass         http://keycloak:8080;
        proxy_set_header   Host              $host:$server_port;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $forwarded_proto;
    }
}

# admin.auth.localhost: admin console and admin API.
server {
    listen 8080;
    server_name admin.auth.localhost;

    # The admin console calls the built-in impersonation path; hand it to the plugin instead.
    # Must be at server level: "rewrite ... last" is evaluated before a location is picked.
    rewrite ^/admin/realms/([^/]+)/users/([^/]+)/impersonation$ /admin/realms/$1/impersonation/users/$2 last;

    location / {
        proxy_pass         http://keycloak:8080;
        proxy_set_header   Host              $host:$server_port;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $forwarded_proto;
    }
}
